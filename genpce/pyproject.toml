[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpce"
version = "0.1.0"
description = "GenPCE: generative circuit synthesis (GQE) for Pauli-correlation-encoded combinatorial optimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Achraf Boussahi", email = "ashraf@aiqcommunity.org" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "networkx>=3.2",
    "torch>=2.2",
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
hardware = ["qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["genpce*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
